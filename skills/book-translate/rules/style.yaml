# Style lint. Findings are checked against the aligned source: a device mirrored from the
# author is only a suggestion (spec 8.3). Not a quality gate: see references/edit.md.
- id: CHAT-01
  mode: direct
  sev: critical
  re: \bконечно!|\bотличный вопрос|\bрад помочь|\bнадеюсь,? (?:это|что это)\b[^.!?\n]{0,20}полезн|\bдавайте разбер[её]мся|\bхотите,? чтобы я\b|\bесли нужно,? (?:я )?могу\b
- id: CHAT-02
  mode: direct
  sev: critical
  re: :contentReference|oai_citation|oaicite|utm_source=(?:chatgpt|openai)|turn\d+(?:search|fetch|file)\d+|citeturn|【\d+|</?think>|\[citation:\d+\]
