<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" role="img" aria-label="Four layers of control: each error has its own filter"><title>Four layers of control: each error has its own filter</title>
<style>
  svg { --bg:#fcfcfb; --panel:#f3f2ee; --line:#d9d7cf; --ink:#0b0b0b; --ink2:#52514e; --a:#2a78d6; --b:#eb6834; --a-soft:#e3eefb; --b-soft:#fdeadf; --hair:#e9e7e0; }
  @media (prefers-color-scheme: dark) { svg { --bg:#1a1a19; --panel:#252523; --line:#3b3a37; --ink:#f0efec; --ink2:#c3c2b7; --a:#3987e5; --b:#d95926; --a-soft:#1e2f45; --b-soft:#3d2a20; --hair:#2f2e2b; } }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .s { fill: var(--ink2); }
  .mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
  .b { font-weight: 650; }
</style>
<rect width="1080" height="400" rx="14" fill="var(--bg)" stroke="var(--line)"/><text x="32" y="40" font-size="19" class="b" text-anchor="start">Four layers of control: each error has its own filter</text><rect x="32" y="62" width="1016" height="64" rx="10" fill="var(--a-soft)" stroke="var(--a)"/><text x="58" y="102" font-size="24" class="b" text-anchor="middle">1</text><text x="86" y="90" font-size="15" class="b" text-anchor="start">Code: facts</text><text x="86" y="110" font-size="12" class="s" text-anchor="start">bt qa, bt gate, PDF checks</text><text x="430" y="99" font-size="13.5" class="" text-anchor="start">lost text, terms off the glossary, numbers, links, stale evidence</text><line x1="58" y1="126" x2="58.0" y2="135.0" stroke="var(--ink2)" stroke-width="1.6"/><polygon points="58.0,139.0 54.5,131.8 61.5,131.8" fill="var(--ink2)"/><rect x="32" y="140" width="1016" height="64" rx="10" fill="var(--b-soft)" stroke="var(--b)"/><text x="58" y="180" font-size="24" class="b" text-anchor="middle">2</text><text x="86" y="168" font-size="15" class="b" text-anchor="start">Check against the source</text><text x="86" y="188" font-size="12" class="s" text-anchor="start">agent, every paragraph</text><text x="430" y="177" font-size="13.5" class="" text-anchor="start">meaning, strength of claims, the authorial voice</text><line x1="58" y1="204" x2="58.0" y2="213.0" stroke="var(--ink2)" stroke-width="1.6"/><polygon points="58.0,217.0 54.5,209.8 61.5,209.8" fill="var(--ink2)"/><rect x="32" y="218" width="1016" height="64" rx="10" fill="var(--b-soft)" stroke="var(--b)"/><text x="58" y="258" font-size="24" class="b" text-anchor="middle">3</text><text x="86" y="246" font-size="15" class="b" text-anchor="start">Reading Russian only</text><text x="86" y="266" font-size="12" class="s" text-anchor="start">agent, without the source</text><text x="430" y="255" font-size="13.5" class="" text-anchor="start">calques, stock phrases, unnatural text</text><line x1="58" y1="282" x2="58.0" y2="291.0" stroke="var(--ink2)" stroke-width="1.6"/><polygon points="58.0,295.0 54.5,287.8 61.5,287.8" fill="var(--ink2)"/><rect x="32" y="296" width="1016" height="64" rx="10" fill="var(--panel)" stroke="var(--ink2)"/><text x="58" y="336" font-size="24" class="b" text-anchor="middle">4</text><text x="86" y="324" font-size="15" class="b" text-anchor="start">Independent judge</text><text x="86" y="344" font-size="12" class="s" text-anchor="start">another model, diagnosis only</text><text x="430" y="333" font-size="13.5" class="" text-anchor="start">confident meaning errors the translator cannot see in its own work</text><path d="M1048 328 H1066 V94 H1050" fill="none" stroke="var(--ink2)" stroke-width="1.6"/><line x1="1054" y1="94" x2="1054.0" y2="94.0" stroke="var(--ink2)" stroke-width="1.6"/><polygon points="1050.0,94.0 1057.2,90.5 1057.2,97.5" fill="var(--ink2)"/><text x="1048" y="390" font-size="13" class="s" text-anchor="end">Judge findings become rules for the next chapter</text></svg>
