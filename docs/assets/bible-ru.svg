<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" width="1080" role="img" aria-label="Справочник живой: изменение решения видно во всей книге"><title>Справочник живой: изменение решения видно во всей книге</title>
<style>
  svg { --bg:#fcfcfb; --panel:#f3f2ee; --line:#d9d7cf; --ink:#0b0b0b; --ink2:#52514e; --a:#2a78d6; --b:#eb6834; --a-soft:#e3eefb; --b-soft:#fdeadf; --hair:#e9e7e0; }
